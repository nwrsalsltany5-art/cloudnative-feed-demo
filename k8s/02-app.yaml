apiVersion: apps/v1
kind: Deployment
metadata:
  name: public-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: public-app
  template:
    metadata:
      labels:
        app: public-app
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      initContainers:
      - name: wait-for-db
        image: busybox:1.36
        command: ['sh', '-c', 'until nc -z postgres-service 5432; do echo "waiting for postgres..."; sleep 2; done']
      containers:
      - name: public-app
        image: public-app:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: DB_HOST
          value: "postgres-service"
        - name: DB_PORT
          value: "5432"
        - name: DB_USER
          value: "appuser"
        - name: DB_PASSWORD
          value: "secretpassword"
        - name: DB_NAME
          value: "appdb"
---
apiVersion: v1
kind: Service
metadata:
  name: public-app-service
spec:
  type: NodePort
  selector:
    app: public-app
  ports:
  - port: 80
    targetPort: 8080
    nodePort: 30080