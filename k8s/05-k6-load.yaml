apiVersion: v1
kind: ConfigMap
metadata:
  name: k6-script
data:
  load-test.js: |
    import http from 'k6/http';
    import { sleep } from 'k6';

    export const options = {
      stages: [
        { duration: '30s', target: 20 },
        { duration: '1m',  target: 50 },
        { duration: '30s', target: 0  },
      ],
    };

    export default function () {
      http.get('http://public-app-service/api/feed');
      http.post('http://public-app-service/api/photos/1/like');
      sleep(0.1);
    }
---
apiVersion: batch/v1
kind: Job
metadata:
  name: k6-load-test
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: k6
        image: grafana/k6:0.49.0
        command: ["k6", "run", "/scripts/load-test.js"]
        volumeMounts:
        - name: script
          mountPath: /scripts
      volumes:
      - name: script
        configMap:
          name: k6-script