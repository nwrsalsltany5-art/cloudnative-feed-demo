<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Set your operations password</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; color: #172033; background: #f3f6fb; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; display: grid; place-items: center; margin: 0; padding: 24px; }
    main { width: min(100%, 420px); padding: 32px; border-radius: 20px; background: white; box-shadow: 0 12px 40px #17203316; }
    h1 { margin: 0 0 8px; font-size: 1.6rem; }
    p { margin: 0 0 24px; color: #61708a; line-height: 1.5; }
    label { display: block; margin: 16px 0 6px; font-weight: 650; }
    input { width: 100%; padding: 12px; border: 1px solid #cbd4e1; border-radius: 10px; font: inherit; }
    button { width: 100%; margin-top: 20px; padding: 12px; border: 0; border-radius: 10px; color: white; background: #087e9d; font: inherit; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: .6; cursor: wait; }
    #status { min-height: 1.5em; margin-top: 14px; color: #a32637; }
    a { color: #087e9d; }
  </style>
</head>
<body>
  <main>
    <h1>Set your password</h1>
    <p>Choose a password for your authorized operations account. The application does not store or log it.</p>
    <form id="password-form" hidden>
      <label for="password">New password</label>
      <input id="password" name="password" type="password" autocomplete="new-password" required minlength="8" maxlength="1024">
      <label for="confirm-password">Confirm password</label>
      <input id="confirm-password" name="confirm-password" type="password" autocomplete="new-password" required minlength="8" maxlength="1024">
      <button id="submit" type="submit">Update password</button>
    </form>
    <div id="status" role="status" aria-live="polite"></div>
    <p><a href="/admin/login">Return to sign in</a></p>
  </main>
  <script src="/admin/assets/password-update.js" defer></script>
</body>
</html>
